# ============================================================
# nginx — Hardened static file server for Zombieland
# ============================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logs ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    # ── Performance ────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;

    # ── Security: ocultar version ──────────────────────
    server_tokens off;

    # ── Gzip ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ───────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Bloquear acceso a archivos ocultos/sensibles ──
        location ~ /\. {
            deny all;
            return 404;
        }

        # ── Assets del juego — cache largo ─────────────
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;

            # Solo permitir tipos de archivo esperados
            location ~* \.(png|jpg|jpeg|gif|svg|webp|json)$ {
                try_files $uri =404;
            }

            # Bloquear todo lo demás dentro de assets
            location ~* \.(txt|md|psd|url|zip)$ {
                deny all;
                return 404;
            }
        }

        # ── JS/CSS build — cache con hash ──────────────
        location /_build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── SPA fallback ───────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;

            # index.html — no cache (siempre fresco)
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }
        }

        # ── Bloquear rutas sospechosas ─────────────────
        location ~* (\.php|\.asp|\.jsp|\.cgi|\.env|wp-admin|wp-login|xmlrpc) {
            deny all;
            return 404;
        }

        # ── Limitar métodos HTTP ───────────────────────
        if ($request_method !~ ^(GET|HEAD)$ ) {
            return 405;
        }

        # ── Limitar tamaño de request ──────────────────
        client_max_body_size 1k;
        client_body_buffer_size 1k;
        client_header_buffer_size 1k;
        large_client_header_buffers 2 1k;
    }
}
